<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <style>
        html{
            background-color: bisque;
        }
        header{
            background-color: rgb(188, 185, 98);
            text-align: center;

        }
        footer{
            background-color: rgb(188, 185, 98);
        }
    </style>
</head>
<body>
    <header>
        <h1>Place Your Order</h1>
        <a href="main.html">Home</a> | <a href="order.html">Order</a>
    </header>
    <hr>
    <h2>Customer Details</h2>
    <label>Name:<br><input type="text" id="name" name="name"></label><br><br>
    <label>Email:<br><input type="email" id="email" name="name"></label><br><br>
    <label>Address:<br><textarea rows="4" cols="30"></textarea></label><br><br>
    <label>Choose Your Dish:<br></label>
    <select>
        <option>Margherita Pizza</option>
        <option>Cheese Burger</option>
        <option>Hyderabadi Biryani</option>
    </select>
    <br><br>
    <label>Cloose Quantity:<br><input type="number" id="Quantity" name="Quantity"></label>
    <br><br>
    <label>Payment Mode:<br>
        <input type="radio">Cash on Delivery<br>
        <input type="radio">UPI<br>
        <input type="radio">Net Banking<br>
    </label>
    <br>
    <button type="submit">Confirm Order</button><br>
    <hr>
    <footer>
        Thanks For choosing QuickBite!
    </footer>
</body>
</html>
