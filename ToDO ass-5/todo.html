<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendly To-Do List with Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>To-Do List </h2>
        <div class="input-section">
            <input type="text" id="taskNameInput" placeholder="Enter task">
            <input type="time" id="taskDueTimeInput">
            <button id="addTaskButton">Add Task</button>
        </div>
        <ul id="taskListContainer"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
